<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASX PSV Viewer</title>
  <style>
    :root {
      --bg: #0b0f14; --panel:#0f141a; --muted:#9fb0c5; --text:#e6edf3; --accent:#2f81f7; --border:#1e2630; --hover: rgba(47,129,247,.08);
    }
    html, body { height: 100%; }
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 20px; }

    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 8px 0 16px; }
    .toolbar label { font-size: 12px; color: var(--muted); }
    select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }

    table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    thead th { text-align: left; font-size: 13px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); user-select: none; cursor: pointer; }
    tbody td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    tbody tr:hover { background: var(--hover); }

    .col-date { width: 110px; white-space: nowrap; }
    .col-time { width: 80px; white-space: nowrap; }
    .col-headline { width: 42%; }
    .headline { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .pill { font-size: 12px; border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; color: var(--muted); display: inline-block; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media (max-width: 900px) { .col-time { display: none; } .col-headline { width: auto; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 style="margin:0 0 6px 0; font-size:22px; font-weight:600">ASX News Feed</h1>

    <div class="toolbar">
      <label>Sector
        <select id="sectorFilter"><option value="">All</option></select>
      </label>
      <label>Stock
        <select id="stockFilter"><option value="">All</option></select>
      </label>
      <label>Newspaper
        <select id="newspaperFilter"><option value="">All</option></select>
      </label>
    </div>

    <table id="table">
      <thead>
        <tr>
          <th class="col-date" data-col="date">Date ▾</th>
          <th class="col-time" data-col="time">Time</th>
          <th class="col-headline" data-col="headline">Headline</th>
          <th data-col="sector">Sector</th>
          <th data-col="stock">Stock</th>
          <th data-col="newspaper">Newspaper</th>
          <th data-col="link">Link</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div id="status" style="margin-top:10px; font-size:12px; color:var(--muted)"></div>
  </div>

  <script>
    const DEFAULT_URL = 'https://raw.githubusercontent.com/duriandaniel/newspaper/main/asx.psv';
    const DELIM = '|';

    const state = { rows: [], sort: { key: 'date', dir: 'desc' }, idx: {} };

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]);});
    }

    function parsePSV(text) {
      const rows = []; let cur = [], field = '', inQuotes = false; let i = 0;
      while (i < text.length) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"' && text[i+1] === '"') { field += '"'; i += 2; continue; }
          if (ch === '"') { inQuotes = false; i++; continue; }
          field += ch; i++; continue;
        } else {
          if (ch === '"') { inQuotes = true; i++; continue; }
          if (ch === DELIM) { cur.push(field); field = ''; i++; continue; }
          if (ch === '\n' || ch === '\r') {
            if (field.length || cur.length) { cur.push(field); rows.push(cur); cur = []; field = ''; }
            if (ch === '\r' && text[i+1] === '\n') i++;
            i++; continue;
          }
          field += ch; i++; continue;
        }
      }
      if (field.length || cur.length) { cur.push(field); rows.push(cur); }
      return rows.filter(r => r.some(v => String(v).trim() !== ''));
    }

    function detectColumns(header) {
      const map = header.map(h => h.trim().toLowerCase());
      const keys = ['date','time','headline','sector','stock','newspaper','article link'];
      const idx = {}; keys.forEach(k => idx[k] = map.indexOf(k));
      return idx;
    }

    function buildOptions(select, values) {
      const cur = select.value;
      select.innerHTML = '<option value="">All</option>' + Array.from(values).filter(Boolean).sort(function(a,b){return a.localeCompare(b);}).map(function(v){return '<option>' + escapeHtml(v) + '</option>';}).join('');
      if ([].slice.call(select.options).some(function(o){return o.value === cur;})) select.value = cur;
    }

    function applySort(rows) {
      const key = state.sort.key; const dir = state.sort.dir; const ci = state.idx[key]; const mult = dir === 'asc' ? 1 : -1;
      const out = rows.slice();
      if (ci < 0) return out;
      out.sort(function(a,b){
        const va = (a[ci]||'').trim(); const vb = (b[ci]||'').trim();
        return mult * va.localeCompare(vb);
      });
      if (key === 'date') {
        const di = state.idx['date']; const ti = state.idx['time'];
        out.sort(function(a,b){
          const d = -(a[di]||'').localeCompare(b[di]||'');
          if (d !== 0) return d;
          return -(a[ti]||'').localeCompare(b[ti]||'');
        });
      }
      return out;
    }

    function render() {
      const ci = state.idx;
      const sectorSel = document.getElementById('sectorFilter').value;
      const stockSel = document.getElementById('stockFilter').value;
      const newspaperSel = document.getElementById('newspaperFilter').value;

      const filtered = state.rows.filter(function(r){
        const sector = ci['sector']>=0 ? (r[ci['sector']]||'').trim() : '';
        const stock  = ci['stock']>=0 ? (r[ci['stock']]||'').trim()  : '';
        const newspaper = ci['newspaper']>=0 ? (r[ci['newspaper']]||'').trim() : '';
        if (sectorSel && sector !== sectorSel) return false;
        if (stockSel && stock !== stockSel) return false;
        if (newspaperSel && newspaper !== newspaperSel) return false;
        return true;
      });

      const sorted = applySort(filtered);
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = sorted.map(function(r){
        const date = r[ci['date']]||'';
        const time = r[ci['time']]||'';
        const headline = r[ci['headline']]||'';
        const sector = r[ci['sector']]||'';
        const stock = r[ci['stock']]||'';
        const newspaper = r[ci['newspaper']]||'';
        const link = r[ci['article link']]||'';
        const safe = /^https?:\/\//i.test(link) ? link : '';
        return '<tr>' +
          '<td class="col-date">' + escapeHtml(date) + '</td>' +
          '<td class="col-time">' + escapeHtml(time) + '</td>' +
          '<td class="col-headline"><div class="headline">' + escapeHtml(headline) + '</div></td>' +
          '<td>' + escapeHtml(sector) + '</td>' +
          '<td><span class="pill">' + escapeHtml(stock) + '</span></td>' +
          '<td>' + escapeHtml(newspaper) + '</td>' +
          '<td>' + (safe ? '<a href="' + safe + '" target="_blank" rel="noopener">Open article</a>' : '') + '</td>' +
        '</tr>';
      }).join('');

      var sectorSet = new Set();
      var stockSet = new Set();
      var newspaperSet = new Set();
      state.rows.forEach(function(r){
        sectorSet.add((r[ci['sector']]||'').trim());
        stockSet.add((r[ci['stock']]||'').trim());
        newspaperSet.add((r[ci['newspaper']]||'').trim());
      });
      buildOptions(document.getElementById('sectorFilter'), sectorSet);
      buildOptions(document.getElementById('stockFilter'), stockSet);
      buildOptions(document.getElementById('newspaperFilter'), newspaperSet);

      document.getElementById('status').textContent = sorted.length + ' shown • ' + state.rows.length + ' total • sort ' + state.sort.key + ' ' + state.sort.dir;
    }

    async function loadPSV(url) {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = parsePSV(text);
      if (!rows.length) throw new Error('Empty PSV');
      const headerIdx = rows.findIndex(function(r){ return r.join(DELIM).toLowerCase().includes('article link'); });
      const header = headerIdx >= 0 ? rows[headerIdx] : rows[0];
      const data = headerIdx >= 0 ? rows.slice(headerIdx + 1) : rows.slice(1);
      state.idx = detectColumns(header);
      state.rows = data.filter(function(r){ return r.length >= 6; });
      render();
    }

    document.querySelectorAll('thead th').forEach(function(th){
      th.addEventListener('click', function(){
        const key = th.getAttribute('data-col'); if (!key) return;
        if (state.sort.key === key) { state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc'; }
        else { state.sort.key = key; state.sort.dir = 'asc'; }
        document.querySelectorAll('thead th').forEach(function(t){ t.textContent = t.textContent.replace(/\s*[▾▴]$/, ''); });
        th.textContent = th.textContent.replace(/\s*[▾▴]$/, '') + (state.sort.dir === 'asc' ? ' ▴' : ' ▾');
        render();
      });
    });

    loadPSV(DEFAULT_URL).catch(function(e){ document.getElementById('status').textContent = 'Error: ' + e.message; });
  </script>
</body>
</html>
